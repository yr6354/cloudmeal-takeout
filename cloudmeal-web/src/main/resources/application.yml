server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cloudmeal-takeout
  profiles:
    # 本地开发默认 dev；生产通过环境变量覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/cloudmeal_takeout?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  jackson:
    time-zone: Asia/Shanghai

# ------------------------------------------------------------------
# 接口文档
# ------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 管理端
      paths-to-match: /admin/**
      packages-to-scan: com.cloudmeal.takeout.controller.admin
    - group: 用户端
      paths-to-match: /user/**
      packages-to-scan: com.cloudmeal.takeout.controller.user
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# ------------------------------------------------------------------
# MyBatis
# ------------------------------------------------------------------
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cloudmeal.takeout.entity
  configuration:
    map-underscore-to-camel-case: true

# ------------------------------------------------------------------
# 业务配置
# ------------------------------------------------------------------
cloudmeal:
  jwt:
    # 生产环境务必通过环境变量注入，切勿使用默认值
    admin-secret-key: ${JWT_ADMIN_SECRET:cloudmeal-admin-secret-please-change-in-production-0123456789}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:cloudmeal-user-secret-please-change-in-production-0123456789}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: authentication
  alioss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    mchid: ${WECHAT_MCHID:}
    mch-serial-no: ${WECHAT_MCH_SERIAL_NO:}
    private-key-file-path: ${WECHAT_PRIVATE_KEY_FILE:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    we-chat-pay-cert-file-path: ${WECHAT_PAY_CERT_FILE:}
    notify-url: ${WECHAT_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_REFUND_NOTIFY_URL:}

# ------------------------------------------------------------------
# 可观测性
# ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.cloudmeal.takeout.mapper: debug
    com.cloudmeal.takeout.service: info
    com.cloudmeal.takeout.controller: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
